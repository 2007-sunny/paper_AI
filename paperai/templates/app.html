<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperAI</title>
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']], processEscapes: true },
            options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
    <style>
__CSS__
    </style>
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="history-head" id="history-head" hidden>
            <button class="tool" id="history-back">← 返回</button>
            <strong>歷史管理</strong>
        </div>
        <div class="side-actions" id="file-actions">
            <button class="tool" id="open-file">開啟檔案</button>
            <button class="tool" id="open-folder">開啟資料夾</button>
        </div>
        <nav class="doc-list" id="doc-list"></nav>
        <div class="side-foot">
            <div class="settings-menu" id="settings-menu">
                <button class="gear" id="settings-button" aria-label="設定" aria-haspopup="menu" aria-expanded="false">⚙</button>
                <div class="settings-flyout" id="settings-flyout" role="menu" hidden>
                    <button role="menuitem" id="open-history">歷史管理</button>
                    <button role="menuitem" id="open-translation">翻譯設置</button>
                </div>
            </div>
            <span id="usage"></span>
        </div>
    </aside>

    <main class="main">
        <header class="toolbar">
            <button class="tool" id="toggle-sidebar" title="收合側邊欄">☰</button>
            <span class="doc-title" id="doc-title"></span>
            <span class="status" id="status"></span>
            <span class="pager"><input id="page-input" inputmode="numeric" aria-label="頁碼"> / <span id="page-total">—</span></span>
            <button class="tool" id="zoom-out" title="縮小">−</button>
            <button class="tool" id="zoom-label" title="符合寬度">100%</button>
            <button class="tool" id="zoom-in" title="放大">＋</button>
        </header>
        <div class="viewer" id="viewer">
            <p class="empty" id="empty">從左側加入或選擇一份 PDF。</p>
            <div class="pages" id="pages"></div>
        </div>
    </main>

    <section class="settings-panel" id="settings-panel" hidden>
        <div class="lookup-head">
            <strong>翻譯設置</strong>
            <button class="tool" id="settings-close" aria-label="關閉">×</button>
        </div>
        <div class="setting">
            <span class="setting-name">細翻模式</span>
            <div class="segments" id="fine-modes">
                <button data-mode="auto">自動</button>
                <button data-mode="ctrl">按 Ctrl 才翻</button>
                <button data-mode="off">關閉</button>
            </div>
            <p class="doc-note" id="mode-hint"></p>
        </div>
        <div class="setting">
            <span class="setting-name">套用範圍</span>
            <div class="segments" id="mode-scope">
                <button data-scope="all">所有文件</button>
                <button data-scope="doc">僅此文件</button>
            </div>
            <p class="doc-note" id="scope-hint"></p>
        </div>
        <div class="setting">
            <span class="setting-name">粗翻用量</span>
            <p class="setting-value" id="usage-detail"></p>
        </div>
        <details class="advanced">
            <summary>進階</summary>
            <label class="setting-row">預先細翻頁數
                <select id="set-lookahead"><option value="0">0</option><option value="1">1</option><option value="2">2</option></select>
            </label>
            <label class="setting-row">本機模型<select id="set-model"></select></label>
            <label class="setting-row">粗翻每月上限（字元）<input id="set-monthly" type="number" min="0" max="500000"></label>
            <label class="setting-row">解析模型閒置後釋放 VRAM（分鐘）<input id="set-idle" type="number" min="1" max="60"></label>
            <label class="setting-row">每段解析逾時（分鐘）<input id="set-timeout" type="number" min="1" max="30"></label>
            <p class="doc-note">換模型只影響之後翻譯的段落，已完成的譯文不會重翻。</p>
            <button class="tool" id="settings-reset">還原預設值</button>
        </details>
    </section>

    <div class="selection-menu" id="selection-menu" hidden>
        <button id="menu-lookup">查詢</button>
        <button id="menu-ask">擷取內容</button>
    </div>

    <section class="lookup" id="lookup" hidden>
        <div class="lookup-head">
            <strong id="lookup-term"></strong>
            <button class="tool" id="lookup-close" aria-label="關閉">×</button>
        </div>
        <p class="lookup-zh" id="lookup-zh"></p>
        <p class="lookup-more" id="lookup-more"></p>
        <ul class="lookup-sentences" id="lookup-sentences"></ul>
    </section>

    <div class="modal-backdrop" id="ask-modal" hidden>
        <div class="modal">
            <h3>擷取內容</h3>
            <p class="doc-note" id="ask-note"></p>
            <textarea id="ask-text" rows="9" spellcheck="false"></textarea>
            <div class="ask-preview" id="ask-preview"></div>
            <div class="row">
                <button class="tool primary" id="ask-copy">複製</button>
                <a class="tool" href="https://claude.ai/new" target="_blank" rel="noopener">開啟 Claude.ai ↗</a>
                <button class="tool" id="ask-close">關閉</button>
            </div>
            <div class="ask-direct" id="ask-direct" hidden>
                <input id="ask-input" placeholder="想問什麼（選填）" autocomplete="off">
                <button class="tool" id="ask-api">直接問 Claude</button>
            </div>
            <div class="ask-answer" id="ask-answer"></div>
        </div>
    </div>

    <div class="modal-backdrop" id="delete-modal" hidden>
        <div class="modal delete-modal">
            <section id="delete-step-1">
                <h3>要刪除這份文件的翻譯嗎？</h3>
                <div class="delete-preview">
                    <canvas id="delete-canvas"></canvas>
                    <p class="doc-note" id="delete-no-pdf" hidden>找不到原始 PDF，無法預覽。</p>
                </div>
                <p class="delete-title" id="delete-title"></p>
            </section>
            <section id="delete-step-2" hidden>
                <h3>確認永久刪除翻譯檔案</h3>
                <p>將永久刪除「<span id="delete-name"></span>」的轉檔結果、譯文與術語（<span id="delete-size"></span>），無法復原。</p>
                <p><strong>原始 PDF 不會被刪除。</strong>之後重新開啟時需要再轉檔與細翻。</p>
            </section>
            <div class="row">
                <button class="tool" id="delete-next">下一步</button>
                <button class="tool danger" id="delete-confirm" hidden>確認永久刪除</button>
                <button class="tool" id="delete-cancel">取消</button>
            </div>
        </div>
    </div>

    <div class="notice" id="notice" hidden></div>

    <script>
__JS__
    </script>
</body>
</html>
